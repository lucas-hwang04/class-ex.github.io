<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Table</title>
  <style>
    table {
      border-collapse: collapse;        /* gộp viền thành 1 */
      width: 420px;                     /* tùy chọn */
    }
    th, td {
      border: 1px solid #333;           /* viền 1px */
      padding: 5px;                     /* yêu cầu */
      text-align: left;                 /* canh trái */
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <th>Name</th>
      <th>Student ID</th>
    </tr>
    <tr>
      <td>Lucas</td>
      <td>S1123570</td>
    </tr>
  </table>
</body>
</html>
